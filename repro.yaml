claims:
# The figures Amendment 5's "Maximum claim under this registration" licenses, each bound to
# the artifact that holds it. No validity manuscript states them yet: when the prose exists,
# each `text` becomes the sentence as printed and `repro verify` checks the two together.
- id: legacy-reproduces-under-the-frozen-flat-tolerance
  text: The deposited shRNA quantities reproduce from the retired extraction and the retired
    aggregation with absolute error below 1e-06 for every drug and every invariant quantity.
  evidence:
  - kind: metric
    artifact: legacy-reproduction-audit
    name: max absolute error, projected dispersion, legacy route
    reported: "9.755e-07"
    pointer: /layers/legacy_reproduction/P_shrna/max_absolute_error
  - kind: metric
    artifact: legacy-reproduction-audit
    name: drugs in the registered cohort
    reported: "795"
    pointer: /n_drugs
- id: production-satisfies-the-elementwise-rule
  text: Under the authoritative source-derived route, all 795 drug-level comparisons satisfy
    Amendment 2's elementwise rule, at maximum normalized residuals of 0.1953 for projected
    dispersion, 0.4211 for signless alignment and 0.1288 for direction instability.
  evidence:
  - kind: metric
    artifact: two-layer-gate-measurement
    name: max normalized residual, projected dispersion
    reported: "0.1953"
    pointer: /layers/production_equivalence/P_shrna/max_normalized_residual
  - kind: metric
    artifact: two-layer-gate-measurement
    name: max normalized residual, signless alignment
    reported: "0.4211"
    pointer: /layers/production_equivalence/E_shrna/max_normalized_residual
  - kind: metric
    artifact: two-layer-gate-measurement
    name: max normalized residual, direction instability
    reported: "0.1288"
    pointer: /layers/production_equivalence/D/max_normalized_residual
- id: routes-are-not-mutually-closer-for-every-drug
  text: The two reconstructable routes agree more closely with each other than either agrees
    with the deposited values for 568 of 795 drugs on projected dispersion, so no claim may
    say this holds for every drug.
  evidence:
  - kind: metric
    artifact: route-to-route-all-drugs
    name: drugs where the routes are mutually closer, projected dispersion
    reported: "568"
    pointer: /summary/P_shrna/n_drugs_where_routes_agree_more_closely_than_either_agrees_with_deposited
- id: the-pre-fix-indexing-does-not-explain-the-residual
  text: The pre-fix shRNA consensus indexing differs from the deposited records by up to 7.818
    in projected dispersion, against 9.755e-07 for the corrected reference, so it does not
    account for the residual.
  evidence:
  - kind: metric
    artifact: d9-indexing-diagnostic
    name: max absolute error against deposited, pre-fix indexing
    reported: "7.818"
    pointer: /summary/P_shrna/max_prefix_to_deposited
